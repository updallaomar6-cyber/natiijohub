
<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NatiijoHub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172554;
      text-align: center;
    }
    header {
      background: #123b70;
      color: white;
      padding: 28px 15px;
    }
    main {
      max-width: 420px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000010;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #cbd5e1;
    }
    button {
      border: none;
      background: #1769d2;
      color: white;
      font-weight: bold;
    }
    footer {
      margin-top: 30px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NatiijoHub</h1>
    <p>Natiijooyinka Ardayda</p>
  </header>
  <main>
    <h2>Hubi Natiijadaada</h2>
    <p>Geli lambarka ardaygaaga iyo PIN-kaaga.</p>
    <form id="resultForm">
      <input type="text" placeholder="Lambarka Ardayga" required>
      <input type="password" placeholder="PIN-kaaga" required>
      <button type="submit">Hubi Natiijada</button>
    </form>
    <p id="message"></p>
  </main>
  <footer>NatiijoHub © 2026</footer>
  <script>
    document.getElementById("resultForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Nidaamka natiijooyinka weli waa la diyaarinayaa.";
    });
  </script>
</body>
</html>
